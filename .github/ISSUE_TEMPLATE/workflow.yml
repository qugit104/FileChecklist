name: Feature request / 功能建议
description: Suggest a change to FileChecklist / 提出功能或操作上的改进。
body:
  - type: textarea
    id: work
    attributes:
      label: Current workflow / 当前操作
      description: Include an example checklist or folder layout if relevant.
    validations:
      required: true
  - type: textarea
    id: obstacle
    attributes:
      label: Suggested change / 希望改进的地方
    validations:
      required: true
